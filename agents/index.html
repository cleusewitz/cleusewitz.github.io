<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 그리드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0a0c11; --grid:#12161f; --tile:#0f131b; --tile-hi:#151b26;
    --line:#1e2632; --line-hi:#2b3646;
    --ink:#e8edf5; --mut:#8a97ab; --faint:#57637a;
    --run:#34e5c4; --run-dim:#0e3b36;
    --done:#4b9bff; --done-dim:#12283f;
    --queue:#f5b13d; --queue-dim:#3a2c10;
    --idle:#6b7688; --idle-dim:#1a1f29;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:44px 44px;background-position:center top;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px}

  /* header */
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mk{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-hi);
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;padding:5px;background:#0c1119}
  .brand .mk i{border-radius:2px;background:var(--idle)}
  .brand .mk i:nth-child(1){background:var(--run);box-shadow:0 0 8px var(--run)}
  .brand .mk i:nth-child(4){background:var(--done)}
  h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
  .sub{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
  .stats{display:flex;gap:22px;font-family:var(--mono)}
  .stat .n{font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:10px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
  .stat.run .n{color:var(--run)} .stat.done .n{color:var(--done)} .stat.queue .n{color:var(--queue)}

  /* grid — 바둑판 */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .tile{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:15px 15px 13px;
    position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
  .tile:hover{border-color:var(--line-hi);transform:translateY(-2px)}
  .tile .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .code{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.04em}
  .pill{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .pill.run{color:var(--run);background:var(--run-dim)} .pill.run .dot{background:var(--run);box-shadow:0 0 6px var(--run);animation:blink 1.1s infinite}
  .pill.done{color:var(--done);background:var(--done-dim)} .pill.done .dot{background:var(--done)}
  .pill.queue{color:var(--queue);background:var(--queue-dim)} .pill.queue .dot{background:var(--queue);animation:blink 2s infinite}
  .pill.idle{color:var(--idle);background:var(--idle-dim)} .pill.idle .dot{background:var(--idle)}
  @keyframes blink{50%{opacity:.25}}

  .app{margin-top:11px;display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:var(--mut);border:1px solid var(--line-hi);border-radius:5px;padding:2px 7px}
  .task{margin-top:9px;font-size:13.5px;font-weight:500;line-height:1.4;color:var(--ink)}
  .ver{color:var(--run);font-family:var(--mono);font-size:12px}
  .note{margin-top:5px;font-size:11.5px;color:var(--faint);line-height:1.4}

  /* activity bar */
  .act{margin-top:12px;height:22px;display:flex;align-items:flex-end;gap:2px}
  .act b{flex:1;background:var(--line-hi);border-radius:1px;opacity:.7}
  .tile.is-run .act b{background:var(--run);animation:eq 1.2s ease-in-out infinite}
  .tile.is-done .act b{background:var(--done);opacity:.5}
  .act b:nth-child(2){animation-delay:.1s}.act b:nth-child(3){animation-delay:.2s}.act b:nth-child(4){animation-delay:.3s}
  .act b:nth-child(5){animation-delay:.15s}.act b:nth-child(6){animation-delay:.25s}.act b:nth-child(7){animation-delay:.05s}
  @keyframes eq{0%,100%{height:30%}50%{height:100%}}

  .metrics{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mut)}
  .metrics .m .v{color:var(--ink);font-variant-numeric:tabular-nums}
  .metrics .m .k{color:var(--faint);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
  .when{position:absolute;right:14px;bottom:12px}

  /* running tile gets a soft scanning glow */
  .tile.is-run{border-color:#20463f}
  .tile.is-run::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--run),transparent);animation:scan 2.6s linear infinite;opacity:.7}
  @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(240px)}}

  footer{margin-top:26px;font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;letter-spacing:.04em}
  #clock{color:var(--mut)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mk"><i></i><i></i><i></i><i></i></div>
      <div>
        <h1>에이전트 그리드</h1>
        <div class="sub">Orca · Agent Control · 레오</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="s-total">7</div><div class="l">Agents</div></div>
      <div class="stat run"><div class="n" id="s-run">1</div><div class="l">Running</div></div>
      <div class="stat done"><div class="n" id="s-done">6</div><div class="l">Done</div></div>
      <div class="stat queue"><div class="n" id="s-q">1</div><div class="l">Queued</div></div>
    </div>
  </header>

  <div class="board" id="board"></div>

  <footer>스냅샷 · 이번 세션 에이전트 실행 기록 · <span id="clock"></span></footer>
</div>

<script>
  // 실제 이번 세션에서 돌린 에이전트들(백그라운드 fork + 온디맨드 검수).
  const AGENTS = [
    {code:"AG-REVIEW", app:"블박 뷰어", status:"run", task:"UI 검수 — 에뮬레이터로 화면 캡처 후 점검",
     note:"웰컴·목록·에디터 렌더 확인 → 사유 한글화·정렬 개선점 발견", tok:"온디맨드", tools:"22", dur:"실행중"},
    {code:"AG-DASH-01", app:"블박 뷰어", status:"done", task:"Tesla Dash 5화면 재구성", ver:"→ v0.8.0",
     note:"웰컴/홈/에디터/신고/완료 레이아웃 재작성", tok:"703K", tools:"6", dur:"5m25s", when:"완료"},
    {code:"AG-DASH-02", app:"블박 뷰어", status:"done", task:"아이콘·하단내비·갤러리 저장", ver:"→ v0.9.0",
     note:"적응형 아이콘 + NavigationBar + MediaStore 저장", tok:"733K", tools:"17", dur:"6m50s", when:"완료"},
    {code:"AG-DASH-03", app:"블박 뷰어", status:"done", task:"이벤트 시점 마커 + 멀티세그먼트", ver:"→ v0.9.2",
     note:"타임라인 빨간 마커 + 조각 이어붙여 전체 재생", tok:"769K", tools:"8", dur:"5m02s", when:"완료"},
    {code:"AG-MATE-01", app:"MateDash", status:"done", task:"구간단속 평균속도 경고", ver:"→ v1.40.0",
     note:"SectionSpeedTracker + jvmTest · 진입~이탈 추정", tok:"772K", tools:"19", dur:"8m35s", when:"완료"},
    {code:"AG-ASSET-01", app:"Assetory", status:"done", task:"배당 캘린더", ver:"→ v1.15.0",
     note:"월별 배당 달력 · 컴파일 에러 자동수정 후 통과", tok:"790K", tools:"24", dur:"복구", when:"완료"},
    {code:"AG-DRIVE-01", app:"DriveLink", status:"queue", task:"BLE 차상태 카드 (대기)",
     note:"배터리·충전·잠금을 BLE로 홈에 표시 — 제안 대기중", tok:"—", tools:"—", dur:"예약", when:"대기"},
  ];
  const LABEL = {run:"실행 중", done:"완료", queue:"대기", idle:"유휴"};
  const board = document.getElementById('board');
  board.innerHTML = AGENTS.map(a => `
    <div class="tile is-${a.status}">
      <div class="top">
        <span class="code">${a.code}</span>
        <span class="pill ${a.status}"><span class="dot"></span>${LABEL[a.status]}</span>
      </div>
      <span class="app">${a.app}</span>
      <div class="task">${a.task}${a.ver?` <span class="ver">${a.ver}</span>`:''}</div>
      <div class="note">${a.note}</div>
      <div class="act">${Array.from({length:8}).map(()=>'<b style="height:'+(20+Math.random()*70).toFixed(0)+'%"></b>').join('')}</div>
      <div class="metrics">
        <div class="m"><div class="v">${a.tok}</div><div class="k">tokens</div></div>
        <div class="m"><div class="v">${a.tools}</div><div class="k">tools</div></div>
        <div class="m"><div class="v">${a.dur}</div><div class="k">time</div></div>
      </div>
    </div>`).join('');

  function tick(){ const d=new Date(); document.getElementById('clock').textContent =
    d.toLocaleString('ko-KR',{hour12:false}); }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveLink 로그인</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d100e; color: #e9ede8; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; padding: 24px; }
  .card { width: 100%; max-width: 400px; text-align: center; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .logo .dot { color: #e82127; }
  h1 { font-size: 17px; font-weight: 600; margin: 22px 0 6px; }
  p { font-size: 13.5px; color: #9da79f; line-height: 1.6; margin: 6px 0 0; }
  .btn { display: inline-block; margin-top: 22px; width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: #e82127; color: #ffffff; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn:active { filter: brightness(1.08); }
  .code-box { margin-top: 18px; display: none; }
  .code-box.show { display: block; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; color: #dce2dc;
    background: #191d19; border: 1px solid #262c25; border-radius: 10px; padding: 12px; margin-top: 8px; }
  .copy { margin-top: 8px; background: transparent; border: 1px solid #333a31; color: #9da79f;
    border-radius: 9px; padding: 8px 14px; font-size: 12.5px; cursor: pointer; }
  .err { color: #e4685a; }
  .spinner { width: 26px; height: 26px; margin: 20px auto 0; border: 3px solid #262c25; border-top-color: #e82127;
    border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">DriveLink<span class="dot">.</span></div>
    <div id="ok" style="display:none">
      <div class="spinner"></div>
      <h1>앱으로 돌아가는 중…</h1>
      <p>자동으로 안 돌아가면 아래 버튼을 누르세요.</p>
      <a id="openBtn" class="btn" href="#">DriveLink 앱 열기</a>
      <div class="code-box" id="codeBox">
        <p style="margin-top:16px">그래도 안 되면 이 코드를 앱의 "수동 연결"에 붙여넣으세요:</p>
        <div class="code" id="codeText"></div>
        <button class="copy" id="copyBtn">코드 복사</button>
      </div>
    </div>
    <div id="fail" style="display:none">
      <h1 class="err">인증 정보를 찾지 못했어요</h1>
      <p>앱에서 다시 로그인해 주세요.</p>
    </div>
  </div>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code");
    if (!code) { document.getElementById("fail").style.display = "block"; return; }

    document.getElementById("ok").style.display = "block";
    // state 등 원본 쿼리를 그대로 넘겨 앱이 검증할 수 있게 함
    var appUrl = "drivelink://auth?" + window.location.search.replace(/^\?/, "");
    document.getElementById("openBtn").setAttribute("href", appUrl);
    document.getElementById("codeText").textContent = code;

    // 자동 복귀 시도 (사용자 제스처 없이 차단하는 브라우저도 있어 버튼을 항상 노출)
    try { window.location.replace(appUrl); } catch (e) {}

    // 1.2초 안에 앱으로 전환 안 됐으면 수동 코드 박스 노출
    setTimeout(function () { document.getElementById("codeBox").classList.add("show"); }, 1200);

    document.getElementById("copyBtn").addEventListener("click", function () {
      var t = document.getElementById("copyBtn");
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject())
        .then(function () { t.textContent = "복사됨 ✓"; })
        .catch(function () {
          var r = document.createRange(); r.selectNode(document.getElementById("codeText"));
          window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
        });
    });
  })();
</script>
</body>
</html>
